<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12110f">
<meta name="color-scheme" content="dark">
<meta name="description" content="A quiet feed of ideas from books. One idea at a time.">
<title>Stash — ideas from books</title>

<style>
/* ===========================================================================
   DESIGN TOKENS
   Feel: dark, calm, book-like. A well-set page, not a dashboard.
   ---------------------------------------------------------------------------
   COLOUR
     --bg          #12110f  near-black, warm (not pure #000)
     --bg-raised   #191714  header / chip rest state
     --rule        #2a2723  hairline dividers, chip borders
     --text        #efe9df  warm off-white — idea text. 15.8:1 on --bg (needs 7:1)
     --text-dim    #9a9187  source lines, inactive chips. 6.9:1 on --bg
     --text-faint  #6f6862  counter, very quiet chrome. 3.6:1 — non-essential only
     --accent      #c8a96a  muted brass. THE one accent: category tag + active chip.
                            8.5:1 on --bg. Used nowhere else.
     --accent-ink  #17140f  text sitting on top of --accent. 8.5:1
   TYPE
     --font-read   Georgia / Iowan Old Style / Times — idea text only
     --font-ui     system-ui — chips, tags, counter, source, buttons
     --fs-idea     clamp(1.3rem -> 1.9rem)   line-height 1.6
     --fs-source   0.875rem                  line-height 1.5
     --fs-ui       0.9375rem
     --fs-tag      0.75rem
   SPACE  (4px base)
     --s-1 4px  --s-2 8px  --s-3 12px  --s-4 16px  --s-5 24px  --s-6 32px  --s-7 48px
   OTHER
     --col        640px   reading column max-width
     --gutter     24px    page gutter — header chrome lines up with the text column
     --radius     6px     one radius, used sparingly
     --tap        44px    minimum tap target
   =========================================================================== */

:root {
  --bg: #12110f;
  --bg-raised: #191714;
  --rule: #2a2723;
  --text: #efe9df;
  --text-dim: #9a9187;
  --text-faint: #6f6862;
  --accent: #c8a96a;
  --accent-ink: #17140f;

  --font-read: Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --fs-idea: clamp(1.3rem, 1.06rem + 1.05vw, 1.75rem);
  --fs-source: 0.875rem;
  --fs-ui: 0.9375rem;
  --fs-tag: 0.75rem;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px;

  --col: 640px;
  --gutter: var(--s-5);
  --radius: 6px;
  --tap: 44px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-ui);
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;                 /* the feed scrolls, not the page */
}

/* --- header ------------------------------------------------------------- */

.masthead {
  flex: none;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top);
}

.bar {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  max-width: calc(var(--col) + 2 * var(--gutter));
  margin: 0 auto;
  padding: var(--s-2) var(--gutter);
}

.wordmark {
  font-family: var(--font-read);
  font-size: 1.0625rem;
  font-weight: 400;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--text);
}

.bar-end {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.counter {
  font-size: var(--fs-tag);
  font-variant-numeric: tabular-nums;
  color: var(--text-faint);
  white-space: nowrap;
}

.shuffle {
  font: inherit;
  font-size: var(--fs-tag);
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  min-height: var(--tap);
  padding: 0 var(--s-4);
  cursor: pointer;
  transition: color 120ms linear, border-color 120ms linear;
}
.shuffle:hover { color: var(--text); border-color: var(--text-faint); }
.shuffle:active { color: var(--text); }

/* --- category chips ----------------------------------------------------- */

.chips {
  display: flex;
  gap: var(--s-2);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  padding: 0 var(--gutter) var(--s-3);
  max-width: calc(var(--col) + 2 * var(--gutter));
  margin: 0 auto;
  /* soft right edge: hints that the row keeps going */
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  font: inherit;
  font-size: var(--fs-tag);
  white-space: nowrap;
  flex: none;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  min-height: var(--tap);
  padding: 0 var(--s-3);
  cursor: pointer;
  transition: color 120ms linear, border-color 120ms linear, background-color 120ms linear;
}
.chip:hover { color: var(--text); border-color: var(--text-faint); }
.chip[aria-pressed="true"] {
  color: var(--accent-ink);
  background: var(--accent);
  border-color: var(--accent);
}

/* --- feed --------------------------------------------------------------- */

.feed {
  position: relative;               /* offsetParent for card.offsetTop */
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }

.card {
  min-height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--s-6) var(--gutter) calc(var(--s-6) + env(safe-area-inset-bottom));
}

.card-inner {
  width: 100%;
  max-width: var(--col);
  margin: 0 auto;
}

.tag {
  font-size: var(--fs-tag);
  color: var(--accent);
  margin: 0 0 var(--s-4);
}

.idea {
  font-family: var(--font-read);
  font-size: var(--fs-idea);
  line-height: 1.6;
  color: var(--text);
  margin: 0;
  text-wrap: pretty;
}

.source {
  font-size: var(--fs-source);
  line-height: 1.5;
  color: var(--text-dim);
  margin: var(--s-5) 0 0;
  padding-top: var(--s-4);
  border-top: 1px solid var(--rule);
}

/* --- empty / error state ------------------------------------------------ */

.notice {
  max-width: var(--col);
  margin: 0 auto;
  padding: var(--s-7) var(--gutter);
  color: var(--text-dim);
  line-height: 1.6;
}
.notice h2 {
  font-family: var(--font-read);
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--text);
  margin: 0 0 var(--s-3);
}
.notice code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.875em;
  color: var(--text);
}

/* --- focus -------------------------------------------------------------- */

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* --- desktop ------------------------------------------------------------ */

@media (min-width: 700px) {
  .card {
    min-height: auto;
    scroll-snap-align: none;        /* looser: mouse-wheel friendly */
    scroll-snap-stop: normal;
    padding: var(--s-7) var(--gutter);
  }
  .card + .card .card-inner { border-top: 1px solid var(--rule); padding-top: var(--s-7); }
  .feed { scroll-snap-type: none; }
  .idea { line-height: 1.62; }
}

/* --- short phones ------------------------------------------------------- */
/* The longest ideas (~270 chars) overrun a 320x568 card. Trim the chrome
   spacing rather than the idea text, so one card still fills one screen. */

@media (max-width: 699px) and (max-height: 640px) {
  .card {
    padding-top: var(--s-4);
    padding-bottom: calc(var(--s-4) + env(safe-area-inset-bottom));
  }
  .tag { margin-bottom: var(--s-3); }
  .source { margin-top: var(--s-4); padding-top: var(--s-3); }
}

/* --- motion ------------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .feed { scroll-behavior: auto; }
}
</style>

<header class="masthead">
  <div class="bar">
    <h1 class="wordmark">Stash</h1>
    <div class="bar-end">
      <span class="counter" id="counter"></span>
      <button class="shuffle" id="shuffle" type="button" title="Shuffle the deck">Shuffle</button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Filter by category"></nav>
</header>

<main class="feed" id="feed" tabindex="-1"></main>

<script src="facts.js"></script>
<script>
(function () {
  "use strict";

  var feed    = document.getElementById("feed");
  var chipBar = document.getElementById("chips");
  var counter = document.getElementById("counter");
  var shuffleBtn = document.getElementById("shuffle");

  var STORE_KEY = "stash.filter";
  var ALL = "All";

  // --- data check -------------------------------------------------------

  if (typeof FACTS === "undefined" || !Array.isArray(FACTS) || FACTS.length === 0) {
    chipBar.remove();
    shuffleBtn.remove();
    feed.innerHTML =
      '<div class="notice"><h2>No ideas loaded</h2>' +
      "<p>This page expects <code>facts.js</code> to sit beside it and to define a " +
      "global <code>FACTS</code> array. Add the file and reload.</p></div>";
    return;
  }

  // --- helpers ----------------------------------------------------------

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function readStore(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function writeStore(key, value) {
    try { window.localStorage.setItem(key, value); } catch (e) { /* private mode, file:// */ }
  }

  // Fisher–Yates, in place, on a copy of the deck.
  function shuffled(list) {
    var out = list.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // Categories in order of first appearance in the data.
  function categories(list) {
    var seen = Object.create(null), out = [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i].category;
      if (c && !seen[c]) { seen[c] = true; out.push(c); }
    }
    return out;
  }

  var CATEGORIES = categories(FACTS);
  var filter = readStore(STORE_KEY);
  if (filter !== ALL && CATEGORIES.indexOf(filter) === -1) filter = ALL;

  // --- chips ------------------------------------------------------------

  var chipEls = {};

  function buildChips() {
    var frag = document.createDocumentFragment();
    [ALL].concat(CATEGORIES).forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = name;
      b.setAttribute("aria-pressed", String(name === filter));
      b.addEventListener("click", function () { setFilter(name); });
      chipEls[name] = b;
      frag.appendChild(b);
    });
    chipBar.appendChild(frag);
  }

  function markChips() {
    Object.keys(chipEls).forEach(function (name) {
      chipEls[name].setAttribute("aria-pressed", String(name === filter));
    });
    var active = chipEls[filter];
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  // --- feed -------------------------------------------------------------

  var deck = [];
  var cards = [];
  var offsets = [];
  var current = 0;
  var ticking = false;

  function render() {
    var source = filter === ALL
      ? FACTS
      : FACTS.filter(function (f) { return f.category === filter; });

    deck = shuffled(source);

    feed.textContent = "";
    cards = [];

    var frag = document.createDocumentFragment();
    deck.forEach(function (item, index) {
      var card = document.createElement("article");
      card.className = "card";
      card.dataset.index = String(index);

      var inner = document.createElement("div");
      inner.className = "card-inner";

      var tag = document.createElement("p");
      tag.className = "tag";
      tag.textContent = item.category;

      var idea = document.createElement("p");
      idea.className = "idea";
      idea.textContent = item.text;

      inner.appendChild(tag);
      inner.appendChild(idea);

      if (item.source) {
        var src = document.createElement("p");
        src.className = "source";
        src.textContent = item.source;
        inner.appendChild(src);
      }

      card.appendChild(inner);
      frag.appendChild(card);
      cards.push(card);
    });

    feed.appendChild(frag);
    feed.scrollTop = 0;
    current = 0;
    measure();
    paintCounter();
  }

  function paintCounter() {
    counter.textContent = deck.length
      ? (current + 1) + " / " + deck.length
      : "0 / 0";
  }

  function measure() {
    offsets = cards.map(function (c) { return c.offsetTop; });
  }

  // The card sitting at the top of the reading area is the current one.
  // Binary search over cached offsets, so scrolling stays cheap with 500 cards.
  function positionIndex() {
    if (!cards.length) return 0;
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 2) return cards.length - 1;
    var y = feed.scrollTop + 8;
    var lo = 0, hi = offsets.length - 1, found = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (offsets[mid] <= y) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return found;
  }

  function syncCounter() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      ticking = false;
      var idx = positionIndex();
      if (idx !== current) { current = idx; paintCounter(); }
    });
  }

  // --- actions ----------------------------------------------------------

  function setFilter(name) {
    if (name === filter) { reshuffle(); return; }
    filter = name;
    writeStore(STORE_KEY, name);
    markChips();
    render();
  }

  function reshuffle() {
    render();
    feed.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }

  function go(step) {
    var next = current + step;
    if (next < 0 || next >= cards.length) return;
    feed.scrollTo({ top: offsets[next], behavior: reduceMotion ? "auto" : "smooth" });
    current = next;
    paintCounter();
  }

  feed.addEventListener("scroll", syncCounter, { passive: true });
  window.addEventListener("resize", function () { measure(); syncCounter(); });

  shuffleBtn.addEventListener("click", reshuffle);

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;

    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); go(-1); }
  });

  // --- go ---------------------------------------------------------------

  buildChips();
  markChips();
  render();
}());
</script>
